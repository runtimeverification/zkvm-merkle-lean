name: CI

on:
  push:
  pull_request:

jobs:
  rust_and_hax:
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            rust/merkle_root_rs

      - name: Build & test (Rust)
        working-directory: rust/merkle_root_rs
        run: |
          cargo build --verbose
          cargo test --verbose

      - name: Install Rust (nightly) for hax
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustc-dev

      - name: Install hax toolchain (nightly)
        env:
          RUSTUP_TOOLCHAIN: nightly
        run: |
          rustc --version
          cargo install cargo-hax --version 0.3.5 --locked
          cargo install hax-driver --version 0.3.5 --locked
          cargo install hax-rust-engine --version 0.3.5 --locked
          cargo install hax-engine-names-extract --version 0.3.5 --locked
          cargo install hax-export-json-schemas --version 0.3.5 --locked
          which driver-hax-frontend-exporter

      - name: Run hax extraction (nightly)
        env:
          RUSTUP_TOOLCHAIN: nightly
        run: |
          ./scripts/extract.sh

      # - name: Check extraction is committed (no diff)
      #   run: |
      #     git diff --exit-code -- lean/MerkleRootLean/Extracted

  lean_optional_wip:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install elan (Lean toolchain manager)
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Lean cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.elan
            lean/.lake
          key: ${{ runner.os }}-lean-${{ hashFiles('lean-toolchain', 'lean/lean-toolchain', 'lean/lake-manifest.json', 'lean/lakefile.toml') }}
          restore-keys: |
            ${{ runner.os }}-lean-

      # Note: currently WIP, allowed to fail
      - name: Build Lean (WIP)
        working-directory: lean
        continue-on-error: true
        run: |
          lake update
          lake build

